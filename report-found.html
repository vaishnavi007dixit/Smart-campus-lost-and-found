<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Report Found Item</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="form-container">
    <div class="form-card found-card">
      <h2>Report Found Item</h2>
      <form id="found-form">
        <label>Item Name</label>
        <input type="text" id="item-name" placeholder="Item name" required><br>
        <label>Category</label>
        <input type="text" id="category" placeholder="Category" required><br>
        <label>Description</label>
        <input type="text" id="description" placeholder="Description" required><br>
        <label>Where Found</label>
        <label>Location</label>

<div class="location-options">
  <label>
    <input type="radio" name="locationType" value="manual" checked>
    Manual
  </label>

  <label>
    <input type="radio" name="locationType" value="map">
    Use current location
  </label>
</div>

<input
  type="text"
  id="manual-location"
  placeholder="Enter location manually"
/>

<button type="button" id="get-location-btn" style="display:none;">
  Get My Location
</button>

<p id="location-status" class="location-status"></p>


        <label>Date Found</label>
        <input type="date" id="date-found"><br>
        <label>Contact Email</label>
        <input type="email" id="contact-email" placeholder="Email" required><br>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
